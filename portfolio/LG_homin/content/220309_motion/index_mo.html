			<script>
				function openExternalBrowser(url){
					if ($nuxt.$native.connected){// 앱일경우
						try {
							window.$nuxt.$native.pluginOpenBrowser({url: url});
						} catch (e){
							console.log( '호출 오류' );
						}
					} else {// 모바일웹이나 네이버 앱 등 홈인앱이 아닌경우
						window.open(url);
					}
				}

				function dwrk_viewAnim (target){
					$(target).each(function(){
						var targetTop = $(this).offset().top;

						if ($(this).attr('anime-stlye') == 1){ // 화면에 나타날때 노출, 유지
							if ($(window).scrollTop() >= targetTop - ($(window).height()/2)){
								$(this).addClass('on')
							} else {
								//$(this).removeClass('on')					
							}
						} else if ($(this).attr('anime-stlye') == 2){ // 화면에 나타날때 노출되며, 화면에서 가려질때 비노출됨.
							if ($(window).scrollTop() >= targetTop - $(window).height() && $(window).scrollTop() < targetTop + $(this).height()){
								$(this).addClass('on')
							} else {
								$(this).removeClass('on')
							}
						}
					})
				}
				dwrk_viewAnim('.dwrk_viewAnim')
				$(window).scroll(function(){
					dwrk_viewAnim('.dwrk_viewAnim')
				})
				$(document).on('click', '.dwrk_tabArea a', function(){
					$('html, body').animate({'scrollTop' : $($(this).attr('href')).offset().top - $('.header_wrap').outerHeight()},500);
					return false;
				});
				$(document).on('click', '.tab_onoff', function(){
					if (!$(this).closest('.dwrk_tab').hasClass('on')){
						$(this).closest('.dwrk_tab').addClass('on')
					} else {
						$(this).closest('.dwrk_tab').removeClass('on')
					}		
				})
			</script>
