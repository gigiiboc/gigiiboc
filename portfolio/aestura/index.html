<!doctype html>
<html lang="ko">
<head>
	<title>AESTURA</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
	<meta name="format-detection" content="telephone=no, address=no, email=no" />
	<meta name="title" content="">
	<meta property="og:title" content="AESTURA">
	<meta property="og:type" content="website" />
	<meta property="og:url" content="http://www.aestura.com/" />
	<meta property="og:site_name" content="AESTURA" />
	<meta property="og:description" content="AESTURA">
	<link type="text/css" rel="stylesheet" href="./css/jquery.fullPage.css">
	<link type="text/css" rel="stylesheet" href="./css/slick.css">
	<link type="text/css" rel="stylesheet" href="./css/ui.css">
	<script type="text/javascript" src="./js/jquery-1.11.2.min.js"></script>
	<script type="text/javascript" src="./js/jquery.easing.1.3.js"></script>
	<script type="text/javascript" src="./js/jquery.mousewheel.min.js"></script>
	<script type="text/javascript" src="./js/jquery.fullPage.min.js"></script>
	<script type="text/javascript" src="./js/slick.min.js"></script>
	<script src="./js/jquery.inview.js"></script>
</head>
<body>
	<div id="wrap">
		<header>
			<h1><a href="#"><img src="./images/logo.png" alt="AESTURA"></a></h1>
			<ul class="gnb">
				<li><a href="#"><img src="./images/gnb1.png" alt="PRODUCT"></a></li>
				<li><a href="#"><img src="./images/gnb2.png" alt="BRAND"></a></li>
				<li><a href="#"><img src="./images/gnb3.png" alt="A-JOURNAL"></a></li>
				<li><a href="#"><img src="./images/gnb4.png" alt="EVENT&NEWS"></a></li>
			</ul>
			<span class="util"><img src="./images/util.jpg" alt=""></span>
		</header>
		<div id="container">
			<div class="pdtView">
				<div class="pdt_visual">
					<div class="topVisual">
						<div class="visualImg">
							<div class="item" style="background-image: url(./images/img_main1.jpg)"></div>
							<div class="item" style="background-image: url(./images/img_main2.jpg)"></div>
							<div class="item" style="background-image: url(./images/img_main3.jpg)"></div>
						</div>
						<div class="visualThumb">
							<ul>
								<li><button class="on" data-index="1"><img src="./images/img_Thumb1.png" alt=""></button></li>
								<li><button data-index="2"><img src="./images/img_Thumb2.png" alt=""></button></li>
								<li><button data-index="3"><img src="./images/img_Thumb3.png" alt=""></button></li>
							</ul>
						</div>
					</div>
				</div>
				<div class="pdt_order">
					<div class="pdt_ttl01">아토베리어<br> 인텐시브 크림</div>
					<div class="pdt_ttl02"><img src="./images/pdt_order_ttl02.png" alt="ATOBARRIER INTENSIVE CREAM"></div>
					<div class="pdt_tag"><span>극건성</span><span>민감성</span><span>낯/밤</span></div>
					<p class="pdt_p">손상된 피부 장벽 기능을 강화시켜주는 <br>밤 타입의 집중보습제</p>
					<div class="pdt_ml">100ml</div>
					<div class="pdt_btn"><a href="#none">구매하러 가기</a></div>
					<div class="pdt_share">
						<a href="#none" id="share_fb" class="fb"><span class="blind">페이스북 공유하기</span></a>
						<a href="#none" id="share_kt" class="kt"><span class="blind">카카오톡 공유하기</span></a>
						<a href="#none" id="share_url" class="url"><span class="blind">URL 복사하기</span></a>
					</div>
				</div>
			</div>
			<div class="pdt_con">
				<div class="sec1">
					<img src="./images/pdt_sec01_bg01.jpg" class="big _a viewAnim" data-time="1" alt="">
					<img src="./images/pdt_sec01_bg02.jpg" class="big _b viewAnim" data-time="1" alt="">
					<img src="./images/pdt_sec01_bg03.jpg" class="big _c viewAnim" data-time="1" alt="">
				</div>
				<div class="sec2">
					<p>“손상된 피부 장벽 기능을 강화시켜주는 밤 타입의 집중보습제”</p>
				</div>			
				<div class="sec3">
					<ul>
						<li>
							<img src="./images/pdt_sec03_txt01.png" class="_a viewAnim" data-time="1" alt="건강한 피부장벽 강화를 위한 고보습 크림, 손상된 피부 장벽기능 강화에 도움을 주며, 건조함과 그로인한 가려움을 케어해주는 보습크림 입니다.">
							<img src="./images/pdt_sec03_img01.gif" class="_b viewAnim" data-time="1" alt="">
						</li>
						<li>
							<img src="./images/pdt_sec03_txt02.png" class="_c viewAnim" data-time="1" alt="피부 지질과 유사한 구조의 더마온(DermaON®)소프트 캡슐 기술이 피부속으로 깊게 흡수를 도와줍니다.">
							<img src="./images/pdt_sec03_img02.png" class="_d viewAnim" data-time="1" alt="">
						</li>
						<li>
							<img src="./images/pdt_sec03_txt03.png" class="_e viewAnim" data-time="1" alt="손상된 피부 장벽 기능을 강화시켜주는 밤 타입의 집중보습제">
							<img src="./images/pdt_sec03_img03.png" class="_f viewAnim" data-time="1" alt="">
						</li>
					</ul>
					<div class="video_section">
						<video id="player"><source src="./video/Aestura_1080p.mp4" type="video/mp4"></video>
						<a href="#none" class="play_btn" onclick="videoPlay()"></a>
						<a href="#none" class="pause_btn" onclick="videoPause()"></a>
						<a href="#none" class="thumb" onclick="videoPlay()"></a>
					</div>
					<img src="./images/pdt_sec03_bg.jpg" class="big" alt="">
				</div>
				<div class="sec4 viewAnim" data-time="2">
					<span class="ctt"></span>
					<span class="bg"></span>
					<span class="bg2"></span>
				</div>
				<div class="sec5">
					<img src="./images/pdt_sec05_bg.png" class="big" alt="">				
				</div>
			</div>
		</div>
	</div>
	<script>
		$(window).scroll(function(){
			viewAnim('.viewAnim')
		})
	</script>
	<script type="text/javascript" src="./js/ui.js"></script>
</body>
</html>
