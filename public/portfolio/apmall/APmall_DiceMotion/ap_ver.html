					dice01 = Math.floor( Math.random() * (diceData-1) ) + 1 
					dice02 = diceData - dice01		
				} else {
					dice01 = Math.floor( Math.random() * (6-diceData+6+1) ) + diceData-6
					dice02 = diceData - dice01
				}
				$('.dim').addClass('on')
				$('.dice01').addClass('diceAni0' + dice01)
				$('.dice02').addClass('diceAni0' + dice02)
				TweenMax.to('.diceGameContent', 1, {
					delay: DiceDelay,
					onStart : function() {
						$('.diceGameContent').addClass('on gift' + diceData)
						TweenMax.to('.diceGame', 1, {
							delay: 1,
							onStart : function() {
								switch(diceData){
									case 2 :
										diceGamePopup(1) // 1000원 쿠폰
										break;
									case 3 :
										diceGamePopup(2) // 3000원 쿠폰
										break;
									case 4 :
										diceGamePopup(1) // 1000원 쿠폰
										break;
									case 5 :
										diceGamePopup(3) // 5000원 쿠폰
										break;
									case 6 :
										diceGamePopup(1) // 1000원 쿠폰
										break;
									case 7 :
										diceGamePopup(4) // 7종 사은품
										break;
									case 8 :
										diceGamePopup(3) // 5000원 쿠폰
										break;
									case 9 :
										diceGamePopup(5) // 10종 사은품
										break;
									case 10 :
										diceGamePopup(6) // 5000원 기프트카드
										break;
									case 11 :
										diceGamePopup(1) // 1000원 쿠폰
										break;
									case 12 :
										diceGamePopup(2) // 3000원 쿠폰
										break;
								}
							}
						});
					}
				});
				diceOn = false;
			} else {
				diceGamePopup(0)
			}
		}

		function diceGameEnd (){
			diceGamePopup(diceData)
			$('.diceGameContent').removeClass('on gift' + diceData)
			$('.dice01').removeClass('diceAni0' + dice01)
			$('.dice02').removeClass('diceAni0' + dice02)
			diceData;
			dice01;
			dice02;
		}
		
		function diceGamePopup (e){
			if ($('.diceGamePopup').css('display') == 'none'){
				$('.diceGamePopup').find('img').attr('src', './images/diceGamePopup_1025_' + e + '.png')
				$('.diceGamePopup').show()
				$('.dim').addClass('on')
			} else {
				$('.diceGamePopup').hide()	
				$('.diceGamePopup').find('img').attr('src', '')
				$('.dim').removeClass('on')
			}
		}
	</script>
