	<script type="text/javascript">
		var maxTime = 11;
		var crntlTime = 0;
		var myTimer;

		function graphAction(target){
			crntlTime = target;
			for (i=0; i <= maxTime; i++){
				$('.starBox').removeClass('graph'+i)
			}
			$('.starBox').addClass('graph'+target)
		}
		function graphOn(){
			myTimer = setInterval(function(){
				graphAction(crntlTime)
				console.log(crntlTime)
				crntlTime < maxTime ? crntlTime++ : crntlTime = 0
				//crntlTime = Math.floor(Math.random()*7)
			}, 1000)			
		}
		function graphOff(){
			clearInterval(myTimer)		
		}
		
		graphOn()
	</script>
