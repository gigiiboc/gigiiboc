													<script type="text/javascript">
														$(document).on('click', '.promotion_tab a', function(){
															$('html, body').animate({'scrollTop' : $($(this).attr('href')).offset().top - 115},500);
															return false;
														});
														$(function(){
															var gnb = $('.promotion_tab'),
																gnbPo = gnb.offset().top,
																gnbH = $('.promotion_tab').outerHeight(),
																gnbMenu = $('.promotion_tab ul li'),
																gnbMenuLeng = gnbMenu.length,
																gnbPlace1 = $('#promotion_ctt1'),
																gnbPlace2 = $('#promotion_ctt2'),
																gnbPlace3 = $('#promotion_ctt3'),
																gnbPlace4 = $('#promotion_ctt4'),
																gnbPlace5 = $('#promotion_ctt5'),
																gnbPlace6 = $('#promotion_ctt6');
															$(window).on('scroll', function(){
																gnb.removeClass('on1').removeClass('on2').removeClass('on3').removeClass('on4').removeClass('on5').removeClass('on6');
																if ($(this).scrollTop() > gnbPlace6.offset().top - gnbH){
																	gnb.addClass('on6');
																} else if ($(this).scrollTop() > gnbPlace5.offset().top - gnbH){
																	gnb.addClass('on5');
																} else if ($(this).scrollTop() > gnbPlace4.offset().top - gnbH){
																	gnb.addClass('on4');
																} else if ($(this).scrollTop() > gnbPlace3.offset().top - gnbH){
																	gnb.addClass('on3');
																} else if ($(this).scrollTop() > gnbPlace2.offset().top - gnbH){
																	gnb.addClass('on2');
																} else {
																	gnb.addClass('on1');
																}
																for (var i=0; i<gnbMenuLeng; i++){
																	if ($(gnbMenu.eq(gnbMenuLeng-1-i).find('a').attr('href')).offset().top - gnbH - 0 < $(window).scrollTop()){
																		gnbMenu.find('a').removeClass('current')
																		gnbMenu.eq(gnbMenuLeng-1-i).find('a').addClass('current')
																		break
																	} else {
																		gnbMenu.eq(0).find('a').addClass('current')
																	}
																}
																if ($(this).scrollTop() > gnbPo ){
																	gnb.addClass('fixed').css('top', 0 + 'px');
																} else {
																	gnb.removeClass('fixed').css('top', '0px');
																}
															});
														});
														var swiper = new Swiper(".slide_section01 .promotion_slide", {
																					slidesPerView: 2.125,
																					spaceBetween: 20,
														});
														var swiper = new Swiper(".slide_section02 .promotion_slide", {
																					slidesPerView: 2.145,
																					spaceBetween: 20,
																scrollbar: {
																	el: ".swiper-scrollbar",
																	hide: true,
																},
