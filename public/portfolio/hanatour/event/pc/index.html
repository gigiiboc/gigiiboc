<!DOCTYPE html>
<html lang="ko">
<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta http-equiv="content-type" content="text/html; charset=UTF-8">
      <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <meta name="format-detection" content="telephone=no, address=no, email=no">

      <title>EVENT</title>

      <link rel="shortcut icon" href="https://image.hanatour.com/usr/static/img/pc/favicon.ico">

      <!-- swiper css -->
      <link rel="stylesheet" href="css/modules/swiper.css">
      <!--<![endif]-->
      <link rel="stylesheet" href="css/modules/jquery.sb.css">
      <link rel="stylesheet" href="css/modules/jquery.mCustomScrollbar.css">
      <!-- pc css -->
      <link rel="stylesheet" href="css/base.css">
      <link rel="stylesheet" href="css/layout.css">
      <link rel="stylesheet" href="css/com.css">
      <!-- //pc css -->
      <!-- pc css 분기 -->
      <link rel="stylesheet" href="css/ent.css" id="DefaultCss"  class="chp-pc" /> <!-- //pc css 분기 --><!--[if IE 9]-->

      <!--[if gt IE 9]><!-->
      <script src="js/jquery-3.3.1.min.js"></script>
      <script src="js/hnt_ui.lib.js"></script>
      <!--<![endif]-->
      <script src="js/jquery.placeholder.js"></script>
      <script src="js/jquery.sb.js"></script>
      <script src="js/hnt-ui.js"></script>

</head>
<body>
      
      <div id="wrap">

            <!-- header :: S -->
            <header id="header">
                  <img src="images/event_header_bg.jpg" alt="">
            </header>
            <!-- header :: E -->

            <!-- contents :: S -->
            <div id="container">
                  <div class="inr wide">
                        <div id="contents" class="contents">
                              <div class="event_detail_wrap">
                                    <div>
                                          <!-- EVENT START :: 이벤트 시작 -->
                                          <div class="adminTextEditorLayer">
                                                <style type="text/css">
                                                      .slide_box {position:absolute;top:14%;left:50%;width:100%;max-width:2000px;height:625px;transform:translate(-50%);overflow:hidden;}
                                                      .event_slide {position:absolute;top:0;left:50%;width:960px;height:100%;transform:translate(-50%);}
                                                      .event_slide .swiper-button-prev {background:url("images/210701_pc_event_slide_prev.png") no-repeat left top;background-size:100% auto;top:50%;left:-12.5%;width:25px;height:43px;transform:translate(0,-50%);margin-top:0;}
                                                      .event_slide .swiper-button-next {background:url("images/210701_pc_event_slide_next.png") no-repeat left top;background-size:100% auto;top:50%;right:-12.5%;width:25px;height:43px;transform:translate(0,-50%);margin-top:0;}
                                                      .event_slide .swiper-button-prev.swiper-button-disabled, .event_slide .swiper-button-next.swiper-button-disabled {opacity:0;}
                                                </style>
                                                <div style="position:relative;width:100%;min-width:1200px;height:1200px;background:url('images/210701_pc_event_01.jpg') 50% 0 no-repeat;"></div>
                                                <div style="position:relative;width:100%;min-width:1200px;height:700px;background:url('images/210701_pc_event_02.jpg') 50% 0 no-repeat;">
                                                      <div style="position:absolute;top:24.35%;left:50%;width:850px;height:0;transform:translate(-50%);padding-top:480px;border-radius:25px;">
                                                            <iframe src="https://www.youtube.com/embed/ZWEVFOwyRWo" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:25px;"></iframe>
                                                      </div>
                                                </div>
                                                <div style="position:relative;width:100%;min-width:1200px;height:1200px;background:url('images/210701_pc_event_03.jpg') 50% 0 no-repeat;"></div>
                                                <div style="position:relative;width:100%;min-width:1200px;height:1336px;background:url('images/210701_pc_event_04.jpg') 50% 0 no-repeat;">
                                                      <div class="slide_box">
                                                            <div class="event_slide">
                                                                  <div class="swiper-wrapper">
                                                                        <div class="swiper-slide"><img src="images/210701_pc_event_slide_01.png" alt=""></div>
                                                                        <div class="swiper-slide"><img src="images/210701_pc_event_slide_02.png" alt=""></div>
                                                                        <div class="swiper-slide"><img src="images/210701_pc_event_slide_03.png" alt=""></div>
                                                                        <div class="swiper-slide"><img src="images/210701_pc_event_slide_04.png" alt=""></div>
                                                                        <div class="swiper-slide"><img src="images/210701_pc_event_slide_05.png" alt=""></div>
                                                                        <div class="swiper-slide"><img src="images/210701_pc_event_slide_06.png" alt=""></div>
                                                                        <div class="swiper-slide"><img src="images/210701_pc_event_slide_07.png" alt=""></div>
                                                                  </div>
                                                                  <div class="swiper-button-next"></div>
                                                                  <div class="swiper-button-prev"></div>
                                                            </div>
                                                      </div>
                                                      <a href="#none" style="display:block;position:absolute;top:70%;left:50%;width:300px;height:60px;transform:translate(-50%);font-size:0;text-indent:-9999px;overflow:hidden;">참여하기</a>
                                                </div>
                                                <div style="position:relative;width:100%;min-width:1200px;height:1176px;background:url('images/210701_pc_event_05.jpg') 50% 0 no-repeat;"></div>
                                                <div style="position:relative;width:100%;min-width:1200px;height:682px;background:url('images/210701_pc_event_06.jpg') 50% 0 no-repeat;"></div>
                                                <script type="text/javascript">
                                                      var swiper = new Swiper(".event_slide", {
                                                            slidesPerView: 1,
                                                            spaceBetween: 220,
                                                            navigation: {
                                                                  nextEl: ".swiper-button-next",
                                                                  prevEl: ".swiper-button-prev",
                                                            },
                                                      });
                                                </script>
                                          </div>
                                          <!-- EVENT END :: 이벤트 끝 -->
                                    </div>
                              </div>
                        </div>
                  </div>
            </div>
            <!-- contents :: E-->

            <!-- footer :: S -->
            <footer id="footer">
                  <img src="images/event_footer_bg.jpg" alt="">
            </footer>
            <!-- footer :: E -->

      </div>

      <style type="text/css">
            #header {overflow:hidden;background:url('images/event_header_bg_repeat.jpg') repeat-x center top;}
            #header img {display:block;margin:0 auto;}
            #footer {overflow:hidden;background:url('images/event_footer_bg_repeat.jpg') repeat-x center top;}
            #footer img {display:block;margin:0 auto;}
      </style>

</body>
</html>
