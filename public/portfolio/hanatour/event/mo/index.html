<!DOCTYPE html>
<html lang="ko">
<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta http-equiv="content-type" content="text/html; charset=UTF-8">
      <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <meta name="format-detection" content="telephone=no, address=no, email=no">

      <title>EVENT</title>

      <link rel="shortcut icon" href="https://image.hanatour.com/usr/static/img/pc/favicon.ico">

      <!-- swiper css -->
      <link rel="stylesheet" href="css/swiper.css">
      <!-- mobile css -->
      <link rel="stylesheet" href="css/base.css">
      <link rel="stylesheet" href="css/layout.css">
      <link rel="stylesheet" href="css/com.css">
      <!-- //mobile.css -->
      <!-- mobile css 분기 -->
      <link rel="stylesheet" href="css/ent.css" id="DefaultCss" /> <!-- // mobile css 분기 -->

      <!-- mobile js 기본 -->
      <script src="js/jquery-3.3.1.min.js"></script>
      <script src="js/hnt_ui.lib.js"></script>
      <script src="js/hnt-ui.mobile.js"></script>
      <!-- // mobile js 기본 -->

</head>
<body>
      
      <div id="wrap">

            <!-- header :: S -->
            <header id="header">
                  <span class="progressbar"></span>
                  <img src="images/event_header_bg.jpg" alt="">
            </header>
            <!-- header :: E -->

            <!-- contents :: S -->
            <div id="container">
                  <style type="text/css">
                        .event_page .view_top {padding:0 2rem 2rem;}
                        .event_page .view_con {padding:0;}
                  </style>
                  <div class="contents event_page">
                        <div class="board_warp">
                              <div class="view_kind">
                                    <div class="view_top">

                                    </div>
                                    <div class="view_con">
                                          <!-- EVENT START :: 이벤트 시작 -->
                                          <div class="adminTextEditorLayer">
                                                <style type="text/css">
                                                      .event_slide {display:block;position:absolute;width:80%;top:13%;left:50%;transform:translate(-50%);overflow:hidden;}
                                                      .event_slide .swiper-slide img {width:100%;margin:0 auto;}
                                                      .event_slide_btn.swiper-button-prev {background:url("images/210701_mo_event_slide_prev.png") no-repeat left top;background-size:100% auto;top:28.5%;left:3.5%;width:2.667%;height:0;padding-top:4.667%;margin-top:0;}
                                                      .event_slide_btn.swiper-button-next {background:url("images/210701_mo_event_slide_next.png") no-repeat left top;background-size:100% auto;top:28.5%;right:3.5%;width:2.667%;height:0;padding-top:4.667%;margin-top:0;}
                                                     .event_slide_btn.swiper-button-prev.swiper-button-disabled, .event_slide_btn.swiper-button-next.swiper-button-disabled {opacity:0;}
                                                     .event_slide_btn.swiper-button-prev:after {opacity:0;font-size:0;}
                                                     .event_slide_btn.swiper-button-next:after {opacity:0;font-size:0;}
                                                </style>
                                                <div style="position:relative;">
                                                      <img src="images/210701_mo_event_01.jpg" alt style="display:block;width:100%;">
                                                </div>
                                                <div style="position:relative;">
                                                      <img src="images/210701_mo_event_02.jpg" alt style="display:block;width:100%;">
                                                      <div style="position:absolute;top:15.85%;left:50%;transform:translate(-50%);width:87%;height:0;padding-top:48%;border-radius:4vw;">
                                                            <iframe src="https://www.youtube.com/embed/ZWEVFOwyRWo" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:4vw;"></iframe>
                                                      </div>
                                                </div>
                                                <div style="position:relative;">
                                                      <img src="images/210701_mo_event_03.jpg" alt style="display:block;width:100%;">
                                                </div>
                                                <div style="position:relative;">
                                                      <img src="images/210701_mo_event_04.jpg" alt style="display:block;width:100%;">
                                                      <div class="event_slide">
                                                            <div class="swiper-wrapper">
                                                                  <div class="swiper-slide"><img src="images/210701_mo_event_slide_01.png" alt=""></div>
                                                                  <div class="swiper-slide"><img src="images/210701_mo_event_slide_02.png" alt=""></div>
                                                                  <div class="swiper-slide"><img src="images/210701_mo_event_slide_03.png" alt=""></div>
                                                                  <div class="swiper-slide"><img src="images/210701_mo_event_slide_04.png" alt=""></div>
                                                                  <div class="swiper-slide"><img src="images/210701_mo_event_slide_05.png" alt=""></div>
                                                                  <div class="swiper-slide"><img src="images/210701_mo_event_slide_06.png" alt=""></div>
                                                                  <div class="swiper-slide"><img src="images/210701_mo_event_slide_07.png" alt=""></div>
                                                            </div>
                                                      </div>
                                                      <div class="swiper-button-next event_slide_btn"></div>
                                                      <div class="swiper-button-prev event_slide_btn"></div>
                                                      <a href="#none" style="position:absolute;left:15.7%;top:56%;width:68%;height:9.5%;font-size:0;text-indent:-9999px;overflow:hidden;">참여하기</a>
                                                </div>
                                                <div style="position:relative;">
                                                      <img src="images/210701_mo_event_05.jpg" alt style="display:block;width:100%;">
                                                </div>
                                                <div style="position:relative;">
                                                      <img src="images/210701_mo_event_06.jpg" alt style="display:block;width:100%;">
                                                </div>
                                                <script type="text/javascript">
                                                      var swiper = new Swiper(".event_slide", {
                                                            // spaceBetween: 220,
                                                            navigation: {
                                                                  nextEl: ".swiper-button-next",
                                                                  prevEl: ".swiper-button-prev",
                                                            },
                                                      });
                                                </script>
                                          </div>
                                          <!-- EVENT END :: 이벤트 끝 -->
                                    </div>
                              </div>
                        </div>
                  </div>
            </div>
            <!-- contents :: E -->

            <!-- footer :: S -->
            <footer id="footer">
                  <img src="images/event_footer_bg.jpg" alt="">
                  <div class="quick_menu">
                        <img src="images/event_footer_fixed.jpg" alt="">
                  </div>
            </footer>
            <!-- footer :: E -->

      </div>

      <style type="text/css">
            #header {position:fixed;top:0;left:0;right:0;z-index:1000;margin:0 auto;height:auto;}
            #header img {}
            #footer {}
            #footer img {margin:0 auto;display:block;}
            #footer .quick_menu {width:100%;height:auto;}
      </style>

</body>
</html>
