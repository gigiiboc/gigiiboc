			iTime = new Date(2018, 1, 25, 18, 0, 0), // 한국 2018년 2월 25일 18시 0분 0초

			get_aTime = aTime.getTime(),
			get_bTime = bTime.getTime(),
			get_cTime = cTime.getTime(),
			get_dTime = dTime.getTime(),
			get_eTime = eTime.getTime(),
			get_fTime = fTime.getTime(),
			get_gTime = gTime.getTime(),
			get_hTime = hTime.getTime(),
			get_iTime = iTime.getTime();

		$(document).ready(function(){
			$(".ctt").css("display","block")

			if (nowTime >= get_iTime){ // 한국 2018년 2월 25일 18시 0분 0초
				$('.dep1').addClass('off')
				$('.dep2').addClass('off')
				$('.dep3').addClass('off')
				$('.dep4').addClass('off')

			} else if (nowTime >= get_hTime){ // 한국 2018년 2월 21일 10시 0분 0초
				$('.dep1').addClass('off')
				$('.dep2').addClass('off')
				$('.dep3').addClass('off')
				$('.dep4').addClass('on')

			} else if (nowTime >= get_gTime){ // 한국 2018년 2월 15일 18시 0분 0초
				$('.dep1').addClass('off')
				$('.dep2').addClass('off')
				$('.dep3').addClass('off')
				$('.dep4').addClass('def')

			} else if (nowTime >= get_fTime){ // 한국 2018년 2월 12일 10시 0분 0초
				$('.dep1').addClass('off')
				$('.dep2').addClass('off')
				$('.dep3').addClass('on')
				$('.dep4').addClass('def')

			} else if (nowTime >= get_eTime){ // 한국 2018년 2월 6일 18시 0분 0초
				$('.dep1').addClass('off')
				$('.dep2').addClass('off')
				$('.dep3').addClass('def')
				$('.dep4').addClass('def')

			} else if (nowTime >= get_dTime){ // 한국 2018년 2월 2일 18시 0분 0초
				$('.dep1').addClass('off')
				$('.dep2').addClass('off_first')
				$('.dep3').addClass('def')
				$('.dep4').addClass('def')

			} else if (nowTime >= get_cTime){ // 한국 2018년 2월 1일 10시 0분 0초
				$('.dep1').addClass('off')
				$('.dep2').addClass('on')
				$('.dep3').addClass('def')
				$('.dep4').addClass('def')

			} else if (nowTime >= get_bTime){ // 한국 2018년 1월 30일 18시 0분 0초
				$('.dep1').addClass('off')
				$('.dep2').addClass('def')
				$('.dep3').addClass('def')
				$('.dep4').addClass('def')

			} else if (nowTime >= get_aTime){ // 한국 2018년 1월 23일 0시 0분 0초
				$('.dep1').addClass('on')
				$('.dep2').addClass('def')
				$('.dep3').addClass('def')
				$('.dep4').addClass('def')
			} else {

			}
		})
	</script>
