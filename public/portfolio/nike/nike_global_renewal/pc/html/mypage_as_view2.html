	function openImagePopup(img){
		var targetImg = new Image();
		targetImg.src = (img);
		
		if (targetImg.width != 0 && targetImg.height != 0 ) {
			
			popupWidth = targetImg.width+20;
			popupHeight = targetImg.height+20;
			
			param = "width=" + popupWidth + ",height=" + popupHeight;
			window.open(img, "", param);
		} else {
			alert("이미지 파일이 존재하지 않습니다.");
		}

		targetImg.src = "";
	}
